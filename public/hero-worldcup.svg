<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title>World Cup presentation graphic</title>
  <desc>Maroon presentation-style graphic with a football and tournament banner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6b0000"/>
      <stop offset="100%" stop-color="#290000"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0df9a"/>
      <stop offset="100%" stop-color="#b89b5e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#120000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1350" cy="120" r="260" fill="#ffffff" opacity="0.06"/>
  <circle cx="280" cy="740" r="340" fill="#ffffff" opacity="0.05"/>
  <g opacity="0.16">
    <path d="M0 680h1600" stroke="#fff" stroke-width="2"/>
    <path d="M0 740h1600" stroke="#fff" stroke-width="2"/>
    <path d="M320 0v900" stroke="#fff" stroke-width="2"/>
    <path d="M1280 0v900" stroke="#fff" stroke-width="2"/>
  </g>
  <g transform="translate(170 150)" filter="url(#shadow)">
    <rect x="0" y="0" width="1260" height="600" rx="34" fill="#fff7ef"/>
    <rect x="0" y="0" width="1260" height="92" rx="34" fill="url(#gold)"/>
    <rect x="0" y="58" width="1260" height="34" fill="url(#gold)"/>
    <text x="72" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#3b0000">2030 FIFA World Cup</text>
    <text x="72" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#3b0000">Presentation Day</text>
    <text x="72" y="166" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#6a4b20">A historic tournament with a modern football showcase</text>
    <g transform="translate(760 140)">
      <circle cx="240" cy="170" r="150" fill="#7e0101" opacity="0.12"/>
      <circle cx="220" cy="170" r="116" fill="#ffffff" stroke="#b89b5e" stroke-width="12"/>
      <polygon points="220,114 247,132 239,164 201,164 193,132" fill="#3b0000"/>
      <polygon points="266,146 289,178 271,211 232,211 220,178 239,146" fill="#7e0101"/>
      <polygon points="177,146 201,178 188,211 149,211 131,178 155,146" fill="#b89b5e"/>
      <polygon points="220,200 246,218 237,251 203,251 194,218" fill="#3b0000"/>
    </g>
    <g transform="translate(72 238)">
      <rect x="0" y="0" width="500" height="60" rx="16" fill="#f8efe0"/>
      <rect x="0" y="86" width="420" height="60" rx="16" fill="#f8efe0"/>
      <rect x="0" y="172" width="460" height="60" rx="16" fill="#f8efe0"/>
      <rect x="0" y="258" width="380" height="60" rx="16" fill="#f8efe0"/>
      <g fill="#7e0101" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700">
        <text x="24" y="38">Opening ceremony highlights</text>
        <text x="24" y="124">National teams and supporters united</text>
        <text x="24" y="210">Stadium tech and match analytics</text>
        <text x="24" y="296">A celebration of football culture</text>
      </g>
    </g>
  </g>
</svg>